name: Digital Court 監看

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub 排程常會晚幾分鐘，實際約 5～15 分鐘一次
  workflow_dispatch:
    inputs:
      test:
        description: "只送一則測試通知（確認 Email／LINE 收得到）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 檢查正式站
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          MONITOR_TEST: ${{ inputs.test && '1' || '0' }}
        run: python3 monitor.py
      - name: 狀態有變才存回 repo（每週也存一次，免得排程被 GitHub 停掉）
        if: always() && !inputs.test
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "digital-court-monitor"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "監看狀態：$(python3 -c "import json;print(json.load(open('state.json'))['status'])")"
            git push
          fi
